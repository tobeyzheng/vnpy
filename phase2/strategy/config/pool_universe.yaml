  - {symbol: TSLA,  market: US, market_cap_bucket: large, sector: ConsumerDiscretionary}
  - {symbol: AVGO,  market: US, market_cap_bucket: large, sector: Technology}
  - {symbol: AMD,   market: US, market_cap_bucket: large, sector: Technology}
